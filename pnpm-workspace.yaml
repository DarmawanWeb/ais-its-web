# pnpm settings of this single-package repository (no workspace packages).
# Install scripts are disabled except for the packages listed in onlyBuiltDependencies;
# the others ship prebuilt binaries through optional platform packages or are optional.
onlyBuiltDependencies:
  - msw
ignoredBuiltDependencies:
  - core-js
  - esbuild
  - protobufjs
# Test-only dependency pinned to a release that has been public for several weeks.
overrides:
  axe-core: 4.14.0
