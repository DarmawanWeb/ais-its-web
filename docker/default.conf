# The single-page app (docs/PLATFORM_SPEC.md §12: the gateway routes "/" here).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Runtime configuration and the HTML shell are never cached.
  location = /config.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location = /theme-init.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Content-hashed bundles: cached for a year.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Other static files (logo, ship icons, methodology catalog): revalidated daily.
  location ~* \.(?:png|jpe?g|webp|svg|ico|json|woff2?|ttf)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # API, realtime and tiles belong to the gateway; never answer them with the SPA.
  location ~ ^/(api|ws|tiles|\.well-known)(/|$) {
    return 404;
  }

  # Client-side routes fall back to index.html.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
