name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/darmawanweb/ais-its-web

jobs:
  image:
    name: Versioned Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The npmrc BuildKit secret: registry mapping and token, never stored in a layer.
      - name: Registry credentials for the build
        run: |
          umask 077
          printf '@darmawanweb:registry=https://npm.pkg.github.com/\n//npm.pkg.github.com/:_authToken=%s\n' \
            "$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          secret-files: |
            npmrc=${{ runner.temp }}/npmrc
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Remove registry credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/npmrc"
